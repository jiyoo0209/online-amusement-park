<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="롤러코스터, 바이킹, 회전목마, 대관람차, 자이로드롭. 지금 접속한 사람들과 같이 타는 웹 3D 놀이공원.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="온라인 놀이공원">
<meta property="og:title" content="온라인 놀이공원">
<meta property="og:description" content="지금 접속한 사람들과 같이 롤러코스터 타러 가요.">
<meta name="theme-color" content="#1d2550">
<meta name="park-build" content="@@BUILD@@">
<title>온라인 놀이공원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed WebGL stage; frosted panels pinned to the corners like ride signboards */
:root{
  color-scheme: dark;
  --ink:#fff8ec;
  --ink-dim:rgba(255,248,236,.68);
  --panel:rgba(28,34,72,.5);
  --panel-strong:rgba(24,28,62,.9);
  --line:rgba(255,236,200,.18);
  --accent:#ffcf5a;
  --accent-ink:#2a2140;
  --pop:#ff7a8a;
  --ground:#141a38;
  --font-display:"Jua","Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--ground);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0;width:100%;font-size:14px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas.dragging{cursor:grabbing}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}

/* tags */
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:5px;will-change:transform;white-space:nowrap}
.tag .bub{max-width:210px;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;background:rgba(255,252,245,.97);color:#2a2140;font-size:14px;line-height:1.4;padding:7px 12px;border-radius:15px;box-shadow:0 4px 14px rgba(20,16,40,.25);position:relative;text-align:center;transition:opacity .3s}
.tag .bub::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:rgba(255,252,245,.97);border-bottom:0}
.tag .nm{font-size:12px;font-weight:600;padding:2px 9px 2px 7px;border-radius:99px;background:rgba(20,22,50,.62);color:#fff8ec;display:inline-flex;align-items:center;gap:5px}
.tag .nm i{width:7px;height:7px;border-radius:50%}
.tag .bub.emo{font-size:30px;line-height:1;padding:9px 10px;border-radius:18px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;animation:emoPop .35s ease-out}
@keyframes emoPop{0%{transform:translateY(8px) scale(.6);opacity:0}60%{transform:translateY(-2px) scale(1.08);opacity:1}100%{transform:none}}

#joy{position:fixed;left:calc(max(16px,env(safe-area-inset-left,0px)) + 6px);bottom:calc(96px + env(safe-area-inset-bottom,0px));width:118px;height:118px;border-radius:50%;background:rgba(24,28,62,.28);border:1.5px solid rgba(255,248,236,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none;z-index:3}
#joy .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,248,236,.9);box-shadow:0 3px 12px rgba(10,10,30,.3);pointer-events:none}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
.brand{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px}
.brand .ic{font-size:15px;line-height:1}
.brand b{font-family:var(--font-display);font-weight:400;font-size:16px;letter-spacing:.02em}
.topr{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px}
#soundBtn{width:36px;height:36px;border-radius:50%;padding:0;display:grid;place-items:center}
#soundBtn[aria-expanded="true"],#who[aria-expanded="true"]{background:rgba(255,248,236,.92);border-color:rgba(255,236,200,.6);color:var(--accent-ink)}
#who{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 11px;border-radius:99px;font-size:13.5px}
#who .dot{width:8px;height:8px;border-radius:50%;background:#7ee0a8;box-shadow:0 0 0 3px rgba(126,224,168,.22)}
#who svg{transition:transform .2s}
#who[aria-expanded="true"] svg{transform:rotate(180deg)}
#rideInfo{position:absolute;left:50%;transform:translateX(-50%);top:calc(62px + env(safe-area-inset-top,0px));padding:8px 16px;border-radius:99px;font-size:14px;font-family:var(--font-display);letter-spacing:.02em;white-space:nowrap;background:rgba(24,28,62,.72);pointer-events:none;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.pop{position:absolute;top:calc(60px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;border-radius:16px;background:rgba(24,28,62,.92);box-shadow:0 14px 40px rgba(8,8,24,.4)}
#soundPop{width:250px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:14px}
#soundPop .row{display:flex;flex-direction:column;gap:6px}
#soundPop .head{display:flex;align-items:center;gap:8px}
#soundPop .mute{width:30px;height:30px;border-radius:9px;border:0;padding:0;display:grid;place-items:center;background:rgba(255,248,236,.08);font-size:15px}
#soundPop .mute[aria-pressed="true"]{opacity:.45}
#soundPop label{flex:1;font-size:14px}
#soundPop .pct{font-size:12.5px;color:var(--ink-dim);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.vol{-webkit-appearance:none;appearance:none;width:100%;height:22px;margin:0;background:transparent;cursor:pointer;background-size:100% 6px;background-position:center;background-repeat:no-repeat;border-radius:99px;touch-action:none}
.vol::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:transparent}
.vol::-moz-range-track{height:6px;border-radius:99px;background:transparent}
.vol::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:#fff8ec;border:0;box-shadow:0 2px 8px rgba(10,10,30,.4)}
.vol::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff8ec;border:0}
#people{width:230px;height:140px;padding:6px;overflow:hidden}
#peopleList{list-style:none;margin:0;padding:0 2px 0 0;height:128px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain;scrollbar-width:thin}
#peopleList li{flex:none;height:40px;display:flex;align-items:center;gap:10px;padding:0 8px;border-radius:10px;font-size:14px}
#peopleList li.me{background:rgba(255,248,236,.07)}
#peopleList .av{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
#peopleList .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#peopleList .tag-me{font-size:11px;padding:1px 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);margin-left:4px}
#peopleList .fl{font-size:12px;color:var(--ink-dim);white-space:nowrap}
#people .fade{position:absolute;left:1px;right:1px;bottom:1px;height:30px;border-radius:0 0 15px 15px;background:linear-gradient(rgba(24,28,62,0),rgba(24,28,62,.95));pointer-events:none}

#bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(540px,calc(100vw - 24px));height:60px;box-sizing:border-box;padding:6px;border-radius:20px;background:rgba(24,28,62,.74);display:flex;align-items:center;gap:6px}
#bar button{border:0;color:var(--ink);font-size:13.5px}
#rideChip{height:46px;padding:0 12px 0 8px;border-radius:14px;background:rgba(255,248,236,.1);display:flex;align-items:center;gap:8px;flex:none}
#rideChip[aria-expanded="true"]{background:rgba(255,248,236,.92);color:var(--accent-ink)}
#rideChip .fb{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-size:18px;flex:none}
#rideChip b{font-family:var(--font-display);font-weight:400;font-size:15px}
#bar .act{flex:1;min-width:0;height:46px;border-radius:13px;background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
#bar .act:hover{background:rgba(255,248,236,.06)}
#bar .act[aria-expanded="true"]{background:rgba(255,248,236,.92);color:var(--accent-ink)}
#bar .act.hot{background:var(--accent);color:var(--accent-ink);font-weight:700}
#rideMenu{position:absolute;left:max(12px,calc(50% - 270px));bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(330px,calc(100vw - 24px));box-sizing:border-box;padding:6px;border-radius:18px;background:rgba(24,28,62,.94);box-shadow:0 14px 40px rgba(8,8,24,.4)}
#rideMenu h2{margin:6px 10px 6px;font-family:var(--font-display);font-weight:400;font-size:17px}
#rideList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#rideList button{width:100%;min-height:54px;border:0;border-radius:12px;padding:6px 10px 6px 8px;background:transparent;display:flex;align-items:center;gap:10px;text-align:left;color:var(--ink)}
#rideList button:hover{background:rgba(255,248,236,.06)}
#rideList button.mine{background:rgba(255,207,90,.16)}
#rideList .re{width:36px;height:36px;border-radius:11px;background:rgba(255,248,236,.1);display:grid;place-items:center;font-size:20px;flex:none}
#rideList .rn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#rideList .rn b{font-family:var(--font-display);font-weight:400;font-size:15.5px}
#rideList .rn em{font-style:normal;font-size:12px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rideList .rs{font-size:12px;color:var(--accent);flex:none}
#emoPop{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(540px,calc(100vw - 24px));box-sizing:border-box;border-radius:22px;background:rgba(24,28,62,.92);box-shadow:0 14px 40px rgba(8,8,24,.35);overflow:hidden}
#emoPop .strip{display:flex;align-items:stretch;gap:2px;padding:6px 8px 4px;overflow-x:auto;scrollbar-width:none;overscroll-behavior:contain}
#emoPop .strip::-webkit-scrollbar{display:none}
#emoPop .grp{display:flex;flex-direction:column;align-items:center;flex:none}
#emoPop .cap{font-size:10.5px;color:var(--ink-dim);line-height:1;padding-top:2px}
#emoPop .row{display:flex}
#emoPop .row button{width:44px;height:44px;border:0;border-radius:50%;background:transparent;font-size:25px;line-height:1;display:grid;place-items:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#emoPop .row button:hover{background:rgba(255,248,236,.1)}
#emoPop .sep{width:1px;flex:none;margin:12px 3px 6px;background:rgba(255,236,200,.18)}

/* entry */
#entry{position:fixed;inset:0;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(120% 90% at 50% 100%,rgba(10,12,30,.6),rgba(10,12,30,.05) 60%)}
.card{width:min(380px,100%);padding:26px 24px 22px;display:flex;flex-direction:column;gap:16px;background:var(--panel-strong)}
.card h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:36px;line-height:1.15;letter-spacing:.01em}
.card h1 span{color:var(--accent)}
.card p{margin:0;color:var(--ink-dim);line-height:1.6;font-size:14.5px;word-break:keep-all}
.card label{font-size:12px;letter-spacing:.08em;color:var(--ink-dim)}
.field{display:flex;flex-direction:column;gap:6px}
#nick{border:1px solid var(--line);background:rgba(255,248,236,.06);border-radius:10px;padding:11px 12px;font-size:15px;outline:none}
#nick:focus{border-color:var(--accent)}
.lookrow{display:flex;gap:14px;align-items:center}
#preview{width:120px;height:140px;flex:none;border-radius:12px;background:radial-gradient(circle at 50% 70%,rgba(255,207,90,.25),rgba(255,248,236,.04) 70%);border:1px solid var(--line)}
.lookside{display:flex;flex-direction:column;gap:10px;min-width:0}
.lookside p{margin:0;font-size:13px;line-height:1.55;color:var(--ink)}
#reroll{align-self:flex-start;border:1px solid var(--line);background:rgba(255,248,236,.08);border-radius:99px;padding:7px 14px;font-size:13px}
#enter{border:0;border-radius:12px;padding:13px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-size:18px;letter-spacing:.02em}
.card .meta{font-size:12px;color:var(--ink-dim);display:flex;justify-content:space-between;gap:8px}
.rides-line{display:flex;gap:6px;flex-wrap:wrap}
.rides-line span{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,248,236,.08)}

/* snack menu */
#menu{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,8,24,.35);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.menucard{width:min(360px,100%);padding:22px;background:#3a2140;border:1px solid rgba(255,255,255,.1);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.menucard h2{margin:0 0 4px;font-family:var(--font-display);font-weight:400;font-size:24px}
.menucard .sub{margin:0 0 14px;font-size:13px;color:var(--ink-dim)}
.menucard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.menucard li button{width:100%;display:flex;justify-content:space-between;align-items:baseline;border:0;background:transparent;padding:10px 8px;border-radius:8px;text-align:left;gap:12px}
.menucard li button:hover{background:rgba(255,255,255,.06)}
.menucard li i{font-style:normal}
.menucard li em{font-style:normal;display:block;font-size:12px;color:var(--ink-dim);margin-top:2px}
.menucard .price{font-variant-numeric:tabular-nums;font-family:var(--font-display);color:var(--accent);white-space:nowrap}
.menucard .close{margin-top:12px;width:100%;border:1px solid rgba(255,255,255,.14);background:transparent;border-radius:10px;padding:9px}

#toast{position:fixed;left:50%;top:calc(106px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);padding:9px 16px;border-radius:99px;background:var(--panel-strong);border:1px solid var(--line);font-size:13.5px;opacity:0;transition:.35s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--ground);font-family:var(--font-display);font-size:19px;color:var(--ink-dim);transition:opacity .8s}
#nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--ground);line-height:1.6}
@media (max-width:420px){#bar .act span.lbl{display:none}#rideChip b{display:none}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="tags" hidden></div>
<div id="joy" hidden><div class="knob"></div></div>
<div id="loading">놀이공원 문을 여는 중…</div>

<div id="hud" hidden>
  <header class="brand panel"><span class="ic" aria-hidden="true">🎡</span><b>온라인 놀이공원</b></header>
  <div class="topr">
    <button id="soundBtn" class="panel" type="button" aria-expanded="false" aria-controls="soundPop" aria-label="소리 크기 조절"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18.2 6.8a7.4 7.4 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    <button id="who" class="panel" type="button" aria-expanded="false" aria-controls="people" aria-label="접속 중인 사람 보기"><i class="dot"></i><b id="count">1명</b><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div id="rideInfo" hidden></div>
  <div id="soundPop" class="panel pop" role="dialog" aria-label="소리 크기" hidden>
    <div class="row"><div class="head"><button class="mute" id="parkMute" type="button" aria-pressed="false" aria-label="놀이공원 소리 끄기">🎢</button><label for="parkVol">놀이공원 소리</label><span class="pct" id="parkPct">80%</span></div><input id="parkVol" class="vol" type="range" min="0" max="100" value="80"></div>
    <div class="row"><div class="head"><button class="mute" id="musicMute" type="button" aria-pressed="false" aria-label="음악 끄기">🎵</button><label for="musicVol">음악</label><span class="pct" id="musicPct">60%</span></div><input id="musicVol" class="vol" type="range" min="0" max="100" value="60"></div>
  </div>
  <div id="people" class="panel pop" role="dialog" aria-label="지금 접속 중인 사람" hidden><ul id="peopleList"></ul><div class="fade" id="peopleFade"></div></div>
  <div id="rideMenu" class="panel" role="dialog" aria-label="놀이기구 고르기" hidden><h2>어떤 걸 탈까요?</h2><ul id="rideList"></ul></div>
  <div id="emoPop" class="panel" role="dialog" aria-label="이모지 보내기" hidden><div class="strip"><div class="grp" role="group" aria-label="기분"><span class="cap">기분</span><div class="row"><button type="button" data-e="❤️" aria-label="좋아 ❤️">❤️</button><button type="button" data-e="😆" aria-label="신나 😆">😆</button><button type="button" data-e="😱" aria-label="무서워 😱">😱</button><button type="button" data-e="🥹" aria-label="감동 🥹">🥹</button></div></div><span class="sep" aria-hidden="true"></span><div class="grp" role="group" aria-label="리액션"><span class="cap">리액션</span><div class="row"><button type="button" data-e="👍" aria-label="좋아요 👍">👍</button><button type="button" data-e="👏" aria-label="박수 👏">👏</button><button type="button" data-e="🙌" aria-label="만세 🙌">🙌</button><button type="button" data-e="📸" aria-label="찰칵 📸">📸</button></div></div><span class="sep" aria-hidden="true"></span><div class="grp" role="group" aria-label="놀이공원"><span class="cap">놀이공원</span><div class="row"><button type="button" data-e="🎢" aria-label="롤러코스터 🎢">🎢</button><button type="button" data-e="🎡" aria-label="관람차 🎡">🎡</button><button type="button" data-e="🎠" aria-label="회전목마 🎠">🎠</button><button type="button" data-e="🎈" aria-label="풍선 🎈">🎈</button><button type="button" data-e="🍭" aria-label="솜사탕 🍭">🍭</button></div></div></div></div>
  <nav id="bar" class="panel" aria-label="놀이기구와 행동">
    <button id="rideChip" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="rideMenu" aria-label="놀이기구 고르기"><span class="fb" aria-hidden="true">🎢</span><b>놀이기구</b></button>
    <button id="bWave" class="act" type="button"><span aria-hidden="true">👋</span><span class="lbl">손 흔들기</span></button>
    <button id="bEmo" class="act" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="emoPop"><span aria-hidden="true">😊</span><span class="lbl">이모지</span></button>
    <button id="bSnack" class="act" type="button"><span aria-hidden="true">🍭</span><span class="lbl">간식</span></button>
